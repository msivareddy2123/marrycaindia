else{var st=x.status==='pending'?((oldRec[x.from_id]&&oldRec[x.from_id].status==='later')?'later':'new'):x.status;rec[x.from_id]={note:x.note||'',status:st,at:Date.parse(x.created_at)};}});
var chats={};
ms.forEach(function(m){var o=m.from_id===uid?m.to_id:m.from_id;(chats[o]=chats[o]||[]).push({f:m.from_id===uid?'me':'them',t:m.body,at:Date.parse(m.created_at)});});
var shortl={};sl.forEach(function(x){shortl[x.profile_id]=x.note||'';});
var blocked={};bl.forEach(function(x){blocked[x.blocked]=1;});
REAL.contacts={};ct.forEach(function(x){REAL.contacts[x.user_id]=x;});
// notifications for new events
var k=REAL.known;
if(k){Object.keys(rec).forEach(function(id){if(!k['r'+id]){var pp=null;PROFILES.forEach(function(q){if(q.id===id)pp=q;});S.notif.unshift({t:(pp?pp.name:'Someone')+' sent you an interest.',at:Date.now()});}});
Object.keys(sent).forEach(function(id){if(sent[id].status==='accepted'&&k['s'+id]!=='accepted'){var pp=null;PROFILES.forEach(function(q){if(q.id===id)pp=q;});S.notif.unshift({t:(pp?pp.name:'Someone')+' accepted your interest. You can chat now.',at:Date.now()});}});
Object.keys(chats).forEach(function(id){var n=chats[id].length;if(n>(k['m'+id]||0)&&chats[id][n-1].f==='them'&&openChatId()!==id){var pp=null;PROFILES.forEach(function(q){if(q.id===id)pp=q;});S.notif.unshift({t:'New message from '+(pp?pp.name:'a member')+'.',at:Date.now()});}});}
Object.keys(rec).forEach(function(id){newKnown['r'+id]=1;});Object.keys(sent).forEach(function(id){newKnown['s'+id]=sent[id].status;});Object.keys(chats).forEach(function(id){newKnown['m'+id]=chats[id].length;});
REAL.known=newKnown;
S.sent=sent;S.received=rec;S.chats=chats;S.shortlist=shortl;S.blocked=blocked;
// journey
var have={};[sent,rec].forEach(function(o){Object.keys(o).forEach(function(id){if(o[id].status==='accepted'){have[id]=1;}});});
var jr=S.journey||{};Object.keys(have).forEach(function(id){var j=jr[id]||1;if(j<1)j=1;if((chats[id]||[]).length&&j<2)j=2;jr[id]=j;});S.journey=jr;
// stubs so every referenced id has a profile object
var ref={};[sent,rec,chats,shortl,blocked].forEach(function(o){Object.keys(o).forEach(function(id){ref[id]=1;});});
Object.keys(ref).forEach(function(id){var f=false;PROFILES.forEach(function(q){if(q.id===id)f=true;});if(!f)PROFILES.push(stub(id,blocked[id]?'Blocked member':'Member (unavailable)'));});
save();
var cid=openChatId();
render();if(cid&&S.chats[cid])redrawMsgs(cid);loadPhotos();
if(REAL.again){REAL.again=false;setTimeout(refreshReal,300);}
}).catch(function(e){REAL.busy=false;console.warn(e);});}

var A0={};['dosend','accept','decline','short','savenote','sendmsg','quick','stage','blockit','unblock','reportit'].forEach(function(n){A0[n]=ACT[n];});
function sbFrom(t){return window.mciSB.from(t);}
ACT.dosend=function(e){if(!REAL.on)return A0.dosend(e);var id=e.dataset.id,t=(document.getElementById('notetxt').value||'').trim();if(!t){toast('Write a short note first');return;}
sbFrom('interests').insert({from_id:REAL.uid,to_id:id,note:t.slice(0,300)}).then(function(r){if(r.error){toast(rerr(r.error));return;}A0.dosend(e);refreshReal();});};
ACT.accept=function(e){if(!REAL.on)return A0.accept(e);var id=e.dataset.id;
sbFrom('interests').update({status:'accepted'}).eq('from_id',id).eq('to_id',REAL.uid).then(function(r){if(r.error){toast(rerr(r.error));return;}A0.accept(e);refreshReal();});};
ACT.decline=function(e){if(!REAL.on)return A0.decline(e);var id=e.dataset.id;
sbFrom('interests').update({status:'declined'}).eq('from_id',id).eq('to_id',REAL.uid).then(function(r){if(r.error){toast(rerr(r.error));return;}A0.decline(e);refreshReal();});};
function syncShort(id){if(!REAL.on)return;var q=S.shortlist[id];
if(q!=null){sbFrom('shortlist').upsert({user_id:REAL.uid,profile_id:id,note:String(q).slice(0,500)}).then(function(r){if(r.error)toast(rerr(r.error));});}
else{sbFrom('shortlist').delete().eq('user_id',REAL.uid).eq('profile_id',id).then(function(r){if(r.error)toast(rerr(r.error));});}}
ACT.short=function(e){A0.short(e);syncShort(e.dataset.id);};
ACT.savenote=function(e){A0.savenote(e);syncShort(e.dataset.id);};
function sendReal(id,t,after){sbFrom('messages').insert({from_id:REAL.uid,to_id:id,body:String(t).slice(0,2000)}).then(function(r){if(r.error){toast(rerr(r.error));return;}ensureChat(id);addMsg(id,'me',t);if((S.journey[id]||1)<2)S.journey[id]=2;if(after)after();redrawMsgs(id);save();});}
ACT.sendmsg=function(e){if(!REAL.on)return A0.sendmsg(e);var id=e.dataset.id,inp=document.getElementById('msg'),t=inp.value.trim();if(!t)return;inp.value='';sendReal(id,t,null);};
ACT.quick=function(e){if(!REAL.on)return A0.quick(e);var id=e.dataset.id,t=e.dataset.t;
if(t==='ice'){document.getElementById('msg').value=ICEBREAKERS[hsh(id+Date.now())%4];return;}
if(t==='call')sendReal(id,'Would you like a short video call? I am free Saturday 11 am or Sunday 6 pm.');
if(t==='fam')sendReal(id,'I would like to introduce our families. Shall I ask my parents to call yours?');};
ACT.stage=function(e){if(!REAL.on)return A0.stage(e);var id=e.dataset.id,v=+e.dataset.v;
var tx=v===3?'Our families have met.':'We have decided to take this forward.';
sendReal(id,tx,function(){S.journey[id]=v;save();SH.pop();openSheet(function(){return sChat(id);},{keep:true});setTimeout(function(){redrawMsgs(id);},0);render();if(v===4)toast('Congratulations from the MarryCAindia team');});};
ACT.blockit=function(e){if(!REAL.on)return A0.blockit(e);var id=e.dataset.id;
sbFrom('blocks').insert({blocker:REAL.uid,blocked:id}).then(function(r){if(r.error&&r.error.code!=='23505'){toast(rerr(r.error));return;}A0.blockit(e);refreshReal();});};
ACT.unblock=function(e){if(!REAL.on)return A0.unblock(e);var id=e.dataset.id;
sbFrom('blocks').delete().eq('blocker',REAL.uid).eq('blocked',id).then(function(r){if(r.error){toast(rerr(r.error));return;}A0.unblock(e);refreshReal();});};
ACT.reportit=function(e){if(!REAL.on)return A0.reportit(e);var id=e.dataset.id;
sbFrom('reports').insert({reporter:REAL.uid,reported:id,reason:'Reported from the app'}).then(function(r){if(r.error){toast(rerr(r.error));return;}A0.reportit(e);});};

seed();render();if(!S.setup&&!window.MCI_AUTH)openSetup();
if(window.__mciProf)window.mciBoot(window.__mciProf,window.__mciUser);
</script>
